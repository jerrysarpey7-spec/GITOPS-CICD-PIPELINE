apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: jerrishpapa/my-app:dce5759e374585439e811eee4e69967172c7eb97
        ports:
        - containerPort: 3000

