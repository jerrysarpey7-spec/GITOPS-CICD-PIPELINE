apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: jerrishpapa/my-app:325e6578c567bb0e7c861f66a6571162d42918cc
        ports:
        - containerPort: 3000

