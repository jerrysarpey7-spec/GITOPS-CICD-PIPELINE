 name: GitOps Pipeline with ArgoCD
 on:
  push:
    branches:
      - main

 permissions:
  contents: write  # Required for git push
  packages: read

 jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NodeJS dependencies
        run: npm install

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }} .

      - name: Scan Docker Image with Trivy
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

      - name: Log in to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

      - name: Logout from DockerHub
        if: always()
        run: docker logout

  deploy:
     needs: build
     runs-on: ubuntu-latest
     steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kubectl
        run: |
          curl -sSL -o kubectl https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.7/2024-12-12/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install ArgoCD CLI
   run: |
    curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    chmod +x argocd
    sudo mv argocd /usr/local/bin/argocd

      - name: Login to ArgoCD
  env:
    ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
    ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
    ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  run: |
    echo "Logging into ArgoCD at: $ARGOCD_SERVER"
    argocd login $ARGOCD_SERVER \
        --username $ARGOCD_USERNAME \
        --password "$ARGOCD_PASSWORD" \
        --insecure \
        --grpc-web
    
    echo "Verifying connection..."
    argocd app list

       - name: Refresh ArgoCD App and Sync
  env:
     ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  run: |
    echo "Syncing my-app with ArgoCD..."
    argocd app sync my-app
