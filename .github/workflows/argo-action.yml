name: GitOps Pipeline with Argo CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest/**"
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitops-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/my-app

jobs:
  build:
    name: Test, Build, Scan, and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Push Docker image
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout || true

  update-manifest:
    name: Update Kubernetes Manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update deployment image
        run: |
          git pull --rebase origin main

          sed -i -E \
            "s#(image:[[:space:]]*)[^[:space:]]+#\1${IMAGE_NAME}:${GITHUB_SHA}#" \
            manifest/deployment.yml

          echo "Updated Kubernetes manifest:"
          cat manifest/deployment.yml

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest/deployment.yml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: deploy image ${GITHUB_SHA} [skip ci]"

          git push origin main
