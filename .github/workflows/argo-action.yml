name: GitOps Pipeline with ArgoCD

on: 
  push:
    branches: 
      - main
    paths-ignore:
      - 'manifest/**' # ignore changes to manifest files to prevent loops

permissions:
  contents: write # Required if using GITHUB_TOKEN to push back to the repo

env: 
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with: 
          node-version: '24'

      - name: Install NodeJS dependencies
        run: npm install

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

      - name: Update Kubernetes Manifest
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Update the image tag in your deployment manifest file
          sed -i 's|image: .*/my-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}|g' manifest/deployment.yaml
          
          git commit -am "Update image tag to ${{ github.sha }}"
          git push
